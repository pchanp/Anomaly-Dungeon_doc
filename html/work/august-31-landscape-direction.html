<div id="august-landscape-direction" aria-labelledby="landscape-title">
  <style>
    #august-landscape-direction { color: var(--foreground); }

    #august-landscape-direction .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    #august-landscape-direction svg { width:100%; height:auto; display:block; }
    #august-landscape-direction .label { font: 500 13px sans-serif; fill:var(--foreground); paint-order:stroke; stroke:var(--background); stroke-width:3px; stroke-linejoin:round; }
    #august-landscape-direction .small { font: 12px sans-serif; fill:var(--muted-foreground); }
