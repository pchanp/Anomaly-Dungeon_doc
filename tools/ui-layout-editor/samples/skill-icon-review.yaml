# Skill Icon Review — 仮案レビュー用 Layout Definition
#
# Status: Draft（アイコンはすべて_FIRST DRAFT_。ゲーム内実装前の目視レビュー用）
#
# 正本: docs/systems/skill-build.md（個別スキル案。安定System IDは未決定）
#  -, このYAMLの id はレビュー用の整理であり、ゲーム側の System ID ではない
#  -, 仮称（ヒール、範囲ヒール）は properties.display_name に「（仮称）」[..] として明記
#  -, slot（枠）と image（アイコン）を別 Component に重ねている。
#       z は panel=5 < slot=20 < image=30 の順。IDは slot_01..17 / icon_01..17 で重複なし
#  -, texture の image は normal に assets/skill-icons/<file>.svg を指定（表示用）
