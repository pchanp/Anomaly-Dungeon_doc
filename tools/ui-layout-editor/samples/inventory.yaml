version: 1
screen:
  id: hud
  name: Anomaly Dungeon HUD
  width: 1920
  height: 1080
components:
  - id: anomaly_status
    type: text
    x: 64
    y: 56
    z: 30
    width: 360
    height: 72
    texture: null
    properties:
      text: "HP  100 / 100
        NORMAL  |  LOBBY"
      variant: status
  - id: exposure
    type: gauge
    x: 1480
    y: 60
    z: 30
    width: 360
    height: 32
